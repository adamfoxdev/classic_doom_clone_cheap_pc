# Runs the game's self-test, the map editor's browser test, the screenshot tour and the browser version's test on
# every pull request and every push to main. Everything is headless: the self-test and screenshots never open a window or an audio device, and the
# editor test drives tools/editor/index.html in headless Chromium through Playwright.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Self-test
        run: dotnet run -c Release --no-build -- --selftest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Map editor test
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/editor/test_editor.cjs

      - name: Screenshot tour
        run: dotnet run -c Release --no-build -- --shots shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

  # The browser version: built from the same src/ as the desktop, served by the matchmaker at /play/ as it is on
  # Fly.io, and driven in headless Chromium (tools/web/test_web.cjs): it loads, draws, takes keys, keeps its files, and
  # a scripted two-player session comes out bit for bit the same as the desktop's (so the two can play together).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: The desktop's cross-play probe
        run: |
          dotnet build -c Release
          dotnet run -c Release --no-build -- --sync-probe > "$RUNNER_TEMP/probe.txt"
          cat "$RUNNER_TEMP/probe.txt"

      - name: Build the browser version, and the matchmaker to serve it
        run: |
          dotnet publish web/HexenSharp.Web.csproj -c Release -o "$RUNNER_TEMP/web"
          dotnet publish server/Matchmaker/HexenSharp.Matchmaker.csproj -c Release -o "$RUNNER_TEMP/server"
          cp -r "$RUNNER_TEMP/web/wwwroot" "$RUNNER_TEMP/server/wwwroot/play"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Browser version test
        run: |
          (cd "$RUNNER_TEMP/server" && ASPNETCORE_URLS=http://127.0.0.1:5080 dotnet HexenSharp.Matchmaker.dll > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:5080/health && break; sleep 1; done
          mkdir -p web-shots
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/web/test_web.cjs http://127.0.0.1:5080/play/ "$RUNNER_TEMP/probe.txt" web-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: web-shots/
          if-no-files-found: ignore
          retention-days: 14

  # The renderer benchmark, this branch against the base it's merging into, built and run on the same machine (so
  # the runner's speed cancels out). Each side runs the single-thread benchmark three times, taking each view's best.
  # Fails if this branch is more than 25% slower on average, or 50% on any one view.
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build this branch
        run: dotnet build -c Release -o "$RUNNER_TEMP/head"

      - name: Build the base
        run: |
          git worktree add "$RUNNER_TEMP/base-src" "${{ github.event.pull_request.base.sha }}"
          dotnet build "$RUNNER_TEMP/base-src" -c Release -o "$RUNNER_TEMP/base"

      - name: Benchmark both, alternately
        run: |
          for i in 1 2 3; do
            dotnet "$RUNNER_TEMP/base/HexenSharp.dll" --bench 200 > "$RUNNER_TEMP/base-$i.txt"
            dotnet "$RUNNER_TEMP/head/HexenSharp.dll" --bench 200 > "$RUNNER_TEMP/head-$i.txt"
          done
          cat "$RUNNER_TEMP/head-1.txt"

      - name: Compare
        run: dotnet "$RUNNER_TEMP/head/HexenSharp.dll" --bench-compare 1.25 "$RUNNER_TEMP"/base-*.txt -- "$RUNNER_TEMP"/head-*.txt
