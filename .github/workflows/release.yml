# Release builds: pushing a tag like v1.2.0 tests the game, publishes self-contained single-file builds for Windows and
# Linux (no .NET install needed), zips each with the README and the map editor, zips the browser version too, and
# attaches them to a GitHub release for the tag. Run it by hand (workflow_dispatch) to get the zips as an artifact
# without making a release.
# Then, when the repo has a FLY_API_TOKEN secret (fly tokens create deploy), it deploys the matchmaker to Fly.io with
# the browser version at /play/, built as the same version, so the two can play together from the moment it's out.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          dotnet build -c Release
          dotnet run -c Release --no-build -- --selftest

      - name: Publish and zip
        run: |
          v="${{ steps.version.outputs.version }}"
          for rid in win-x64 linux-x64; do
            dotnet publish -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none -p:Version="$v" -o "out/$rid"
            cp README.md "out/$rid/"
            mkdir -p "out/$rid/editor"
            cp tools/editor/index.html tools/editor/builtin-maps.js "out/$rid/editor/"
            (cd "out/$rid" && zip -qr "../../HexenSharp-$v-$rid.zip" .)
          done
          ./out/linux-x64/HexenSharp --version
          # the browser version: static files, for any web server (the matchmaker serves them at /play/)
          dotnet publish web/HexenSharp.Web.csproj -c Release -p:Version="$v" -o out/web
          (cd out/web/wwwroot && zip -qr "../../../HexenSharp-$v-web.zip" .)
          ls -la HexenSharp-*.zip

      - name: Upload the zips
        uses: actions/upload-artifact@v4
        with:
          name: hexensharp-${{ steps.version.outputs.version }}
          path: HexenSharp-*.zip
          retention-days: 30

      - name: Make the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HexenSharp-*.zip
          generate_release_notes: true

  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy the matchmaker and the browser version to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: |
          curl -sL https://fly.io/install.sh | sh
          ~/.fly/bin/flyctl deploy --remote-only --ha=false --build-arg GAME_VERSION="${GITHUB_REF_NAME#v}"

      - name: No Fly.io token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::No FLY_API_TOKEN secret, so the server wasn't deployed. Deploy it by hand (see README), with --build-arg GAME_VERSION=${GITHUB_REF_NAME#v}."
