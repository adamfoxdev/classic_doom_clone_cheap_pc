# Fly.io config for the Hexen Sharp matchmaker. Deploy from this folder (server/Matchmaker):
#   fly launch --copy-config --no-deploy   (pick your own app name and region)
#   fly deploy --ha=false
#   fly scale count 1
# Rooms live in the server's memory, so it must run as ONE machine: with two, players on different machines
# couldn't see or join each other's rooms.

app = "hexen-matchmaker"      # change to your app's name
primary_region = "iad"        # pick the region nearest your players: every input and frame goes through it

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_URLS = "http://0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  # keep the one machine up: no cold start for the first player, and no rooms lost to a stop
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
