<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexen Sharp</title>
<style>
  :root { color-scheme: dark; --bg: #07070a; --text: #e8e2cf; --dim: #8d887a; --gold: #e6be50; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; background: #000; }
  /* the 320x200 picture, as big as fits, pixels kept sharp */
  #screen { width: min(100vw, calc((100vh - 36px) * 1.6)); aspect-ratio: 16 / 10; image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; }
  #stage:fullscreen #screen { width: min(100vw, calc(100vh * 1.6)); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.75); }
  #overlay[hidden], #hint[hidden] { display: none; }
  #overlay-text { color: var(--gold); font-size: 18px; letter-spacing: .04em; text-align: center; padding: 16px; }
  #hint { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); background: rgba(0,0,0,.7); color: var(--text);
    padding: 6px 14px; border-radius: 6px; font-size: 13px; pointer-events: none; }
  footer { height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; color: var(--dim); font-size: 12px; }
  footer a { color: var(--dim); }
  footer button { font: inherit; color: var(--text); background: #1c1b18; border: 1px solid #34322c; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  footer .links { display: flex; gap: 14px; overflow: hidden; white-space: nowrap; }
  @media (max-width: 520px) { footer .keys { display: none; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="320" height="200" tabindex="0" aria-label="Hexen Sharp"></canvas>
    <div id="overlay"><div id="overlay-text">Loading the game…</div></div>
    <div id="hint" hidden>Click to aim with the mouse (Esc gives it back)</div>
  </div>
  <footer>
    <span class="links">
      <span class="keys">WASD move · mouse aims · Space jumps · T chats · a controller works too</span>
      <a href="../" target="_blank" rel="noopener">Who's on</a>
      <a href="https://github.com/adamfoxdev/classic_doom_clone_cheap_pc/releases" target="_blank" rel="noopener">Desktop version</a>
    </span>
    <button id="fullscreen" type="button">Fullscreen</button>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
